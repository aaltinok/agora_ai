[project]
name = "agora-ai"
version = "1.0.0"
description = "Filozoflarla diyalog kuran, API gerektirmeyen Streamlit uygulaması"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "pyyaml>=6.0", "requests>=2.32", "fpdf2>=2.8"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM108", "SIM905"]  # Türkçe metin, uzun şablonlar

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["config", "llm", "philosophers", "safety", "services", "ui", "utils"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
