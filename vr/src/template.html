<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filozoflarla Yüz Yüze — 3B</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1730;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef3ff}
  #c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:linear-gradient(#0b1730cc,#0b173000)}
  #topic{opacity:.8}
  #who{display:flex;gap:6px}
  #who button.on{background:#4f8cff;border-color:#9fb8ff}
  #setting{font-size:.78rem;opacity:.7;margin-bottom:6px}
  #vrBtn{margin-left:auto}
  #panel{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(860px,96vw);max-height:62vh;overflow:auto;box-sizing:border-box;
         background:#0b1730ea;border:1px solid #2c4a8a;border-radius:16px;padding:14px 16px}
  #subtitle{font-size:1.1rem;line-height:1.5;white-space:pre-wrap;margin-bottom:10px}
  #options{display:flex;flex-wrap:wrap;gap:8px}
  #controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  button{font:inherit;color:#fff;background:#24407a;border:1px solid #3d5fa8;border-radius:10px;padding:8px 14px;cursor:pointer}
  button:hover:not(:disabled){background:#4f8cff}
  button:disabled{opacity:.45;cursor:not-allowed}
  #mic.on{background:#b5384a;border-color:#e46a7a}
  #note{min-height:1.2em;margin-top:8px;font-size:.85rem;color:#ffd58a}
  #privacy{font-size:.75rem;opacity:.65;margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar"><b id="title"></b><span id="topic"></span><span id="who"></span><button id="vrBtn" hidden>VR’ye gir</button></div>
  <div id="panel">
    <div id="setting"></div>
    <div id="subtitle"></div>
    <div id="options"></div>
    <div id="controls">
      <button id="mic">Konuş</button><button id="tts">Ses: Açık</button><button id="stop">Sustur</button>
      <button id="early" hidden>Konuyu değiştirmek istiyorum</button><button id="dl" hidden>Özeti indir</button>
    </div>
    <div id="note"></div>
    <div id="privacy">Mikrofon yalnızca “Konuş”a bastığında açılır. Tarayıcının ses tanıma servisi sesi tarayıcı sağlayıcısına (ör. Google) gönderebilir; okulda kullanmadan önce izin alın. Düğmelerle de cevap verebilirsin. Filozof persona'sı bir simülasyondur.</div>
  </div>
</div>
<script>/*__THREE__*/</script>
<script>window.AGORA_SCRIPTS=/*__DIALOGUE_JSON__*/;</script>
<script>/*__SRC__*/</script>
</body>
</html>
